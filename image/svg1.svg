<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="20%" height="20%">
  <defs>
    <!-- 1. Drop Shadow under the box -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- 2. Glow Filter for the Bow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3. Glossy Highlights -->
    <linearGradient id="gloss-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gloss-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Soft Shadow -->
  <ellipse cx="200" cy="340" rx="80" ry="15" fill="#680816" opacity="0.3" filter="url(#shadow)" />

  <!-- ================= 3D HEART BOX ================= -->
  
  <!-- Bottom Extrusion (Dark Maroon) -->
  <path d="M 55 160 
           C 50 220 120 290 200 340 
           C 280 290 350 220 345 160 
           L 345 190 
           C 350 250 280 320 200 370 
           C 120 320 50 250 55 190 Z" 
        fill="#680816" />

  <!-- Top Lid (Bright Red) -->
  <path d="M 200 130 
           C 150 70 50 90 55 160 
           C 50 220 120 290 200 340 
           C 280 290 350 220 345 160 
           C 350 90 250 70 200 130 Z" 
        fill="#d11026" />

  <!-- Rim Edge (Separating Top and Bottom) -->
  <path d="M 55 160 
           C 50 220 120 290 200 340 
           C 280 290 350 220 345 160" 
        fill="none" stroke="#8a0c19" stroke-width="4" />

  <!-- Gloss Highlights -->
  <path d="M 200 130 C 150 70 50 90 55 160 C 60 180 80 200 120 220 C 120 180 150 150 200 130 Z" fill="url(#gloss-left)" />
  <path d="M 200 130 C 250 70 350 90 345 160 C 340 180 320 200 280 220 C 280 180 250 150 200 130 Z" fill="url(#gloss-right)" />

  <!-- ================= GLOWING WHITE BOW ================= -->
  
  <!-- Wrapped in a group with the glow filter -->
  <g filter="url(#glow)" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left Loop -->
    <path d="M 195 190 C 130 140 120 210 195 190" stroke-width="6" />
    
    <!-- Right Loop -->
    <path d="M 205 190 C 270 140 280 210 205 190" stroke-width="6" />
    
    <!-- Left Tail -->
    <path d="M 190 195 Q 170 230 160 260" stroke-width="6" />
    
    <!-- Right Tail -->
    <path d="M 210 195 Q 230 230 240 260" stroke-width="6" />

    <!-- Center Knot -->
    <ellipse cx="200" cy="190" rx="7" ry="5" fill="#ffffff" stroke-width="0" />
  </g>
</svg>